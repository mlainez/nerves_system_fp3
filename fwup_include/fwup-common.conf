# Firmware metadata for the Fairphone 3 Nerves system.
#
# Override any of these via environment variables of the same name.

define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "Fairphone3")
define(NERVES_FW_ARCHITECTURE, "aarch64")
define(NERVES_FW_AUTHOR, "Spin42")

# The Fairphone 3 Android `userdata` partition. The full Nerves firmware
# image (MBR + uboot env + boot A/B + rootfs A/B + app data, see below)
# is flashed raw into this partition by fastboot; lk2nd-msm8953 then
# reads /extlinux/extlinux.conf from the boot subpartition.
define(NERVES_FW_DEVPATH, "/dev/mmcblk0p62")

# Subpartitions exposed at runtime by the citronics initramfs after a
# kpartx pass over /dev/mmcblk0p62. Linux partition numbers are 1-based
# (so p62p1 = first subpartition).
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/mmcblk0p62p3")
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "f2fs")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")

# Default paths.
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# Subpartition layout inside /dev/mmcblk0p62 (units = 512 B blocks):
#
#   +-------------------------------+
#   | MBR (block 0)                 |
#   +-------------------------------+
#   | uboot env (offset 2048, 8 KB) |
#   +-------------------------------+
#   | Boot A (50 MiB ext2)          |
#   +-------------------------------+
#   | Boot B (50 MiB ext2)          |
#   +-------------------------------+
#   | Rootfs A (250 MiB squashfs)   |
#   +-------------------------------+
#   | Rootfs B (250 MiB squashfs)   |
#   +-------------------------------+
#   | App data (rest, f2fs)         |
#   +-------------------------------+

define(UBOOT_ENV_OFFSET, 2048)
define(UBOOT_ENV_COUNT, 16)  # 8 KB

# Boot A partition of ~100 MiB. Must hold the uncompressed aarch64
# `Image` (~35 MiB) + the citronics initramfs.gz (~15–20 MiB) + the
# device tree + extlinux.conf, packaged as an ext2 image because
# lk2nd-msm8953 cannot read squashfs at boot.
#
# Keep BOOT_A_PART_COUNT in sync with the `-b` size passed to
# genext2fs inside scripts/create-boot-img.sh:
#   blocks_512 (here) == 2 * blocks_1024 (genext2fs -b)
define-eval(BOOT_A_PART_OFFSET, "${UBOOT_ENV_OFFSET} + ${UBOOT_ENV_COUNT}")
define(BOOT_A_PART_COUNT, 204800)
define-eval(BOOT_B_PART_OFFSET, "${BOOT_A_PART_OFFSET} + ${BOOT_A_PART_COUNT}")
define(BOOT_B_PART_COUNT, 204800)

# 250 MiB rootfs slots.
define-eval(ROOTFS_A_PART_OFFSET, "${BOOT_B_PART_OFFSET} + ${BOOT_B_PART_COUNT}")
define(ROOTFS_A_PART_COUNT, 512000)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# App data partition: rest of the userdata partition (it `expand`s).
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 524288)

# Firmware archive metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}
