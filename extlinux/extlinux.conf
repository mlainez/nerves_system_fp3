# Boot configuration read by U-Boot from the active boot subpartition. It
# boots the `default` label.
#
# Nothing needs choosing. One device tree covers both the Fairphone 3 and
# the Fairphone 3+: it describes the swappable camera and loudspeaker slots
# rather than their contents, and the kernel identifies what is fitted and
# applies the matching overlay while it boots. See the README.
default Nerves

label Nerves
	kernel /Image
	fdt /sdm632-fairphone-fp3.dtb
	initrd /initramfs.gz
	append earlycon console=ttyMSM0,115200 console=tty0 loglevel=8 fbcon=rotate:3 fbcon=font:TER16x32 rootfs=/dev/mmcblk0p62p2 bootpart=/dev/mmcblk0p62p1 rootfstype=squashfs ro rootwait panic=30 cma=256M
