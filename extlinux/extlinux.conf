# Boot configuration read by lk2nd-msm8953 from the active boot subpartition.
#
# lk2nd's extlinux parser understands label, default, kernel/linux, initrd,
# fdt/devicetree, fdtdir and fdtoverlays. It does NOT understand `timeout` or
# `menu`, and it always boots the `default` label — there is no interactive
# menu, so anything that needs choosing has to be decided elsewhere.
#
# Nothing does need choosing. One device tree covers both the Fairphone 3 and
# the Fairphone 3+: it describes the swappable camera and loudspeaker slots
# rather than their contents, and the kernel identifies what is fitted and
# applies the matching overlay while it boots. See the README.
default Nerves

label Nerves
	kernel /Image
	fdt /sdm632-fairphone-fp3.dtb
	initrd /initramfs.gz
	append earlycon console=ttyMSM0,115200 console=tty0 loglevel=8 fbcon=rotate:3 fbcon=font:TER16x32 rootfs=/dev/mmcblk0p62p2 bootpart=/dev/mmcblk0p62p1 rootfstype=squashfs ro rootwait panic=30
